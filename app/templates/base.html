<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}수정 예시 문제집{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="/">수정 예시 문제집</a>
        <div class="header-tools">
          <nav class="site-nav">
            <a href="/">문제집</a>
            <a href="/timer">집중 타이머</a>
            <a href="/review">검수</a>
          </nav>
          <div class="header-controls">
            <div class="header-ambient">
              <span class="sr-only">백색소음</span>
              <select class="header-ambient-select" data-ambient-mode aria-label="백색소음 선택">
                <option value="none">소리 끔</option>
                <option value="rain">비 오는 소리</option>
                <option value="library">도서관 소음</option>
                <option value="forest">숲 소리</option>
                <option value="stream">시냇물</option>
                <option value="waves">파도 소리</option>
                <option value="white">화이트 노이즈</option>
                <option value="brown">브라운 노이즈</option>
              </select>
              <button class="button ghost compact" type="button" data-ambient-toggle>재생</button>
            </div>
            <div class="header-timer" data-focus-timer data-focus-minutes="90" data-break-minutes="15">
              <a class="header-timer-link" href="/timer">
                <span class="header-timer-label" data-timer-phase-short>집중</span>
                <strong class="header-timer-time" data-timer-display>90:00</strong>
                <span class="header-timer-meta" data-timer-status>대기 중</span>
              </a>
              <button class="button ghost compact" type="button" data-timer-start-pause>시작</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
    <script src="/static/timer.js"></script>
  </body>
</html>
