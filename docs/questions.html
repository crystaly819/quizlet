<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문제 목록 | 수정 예시 문제집</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/pages-questions.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="./">수정 예시 문제집</a>
        <div class="header-tools">
          <nav class="site-nav">
            <a href="./">문제집</a>
            <a href="./timer.html">집중 타이머</a>
            <a href="https://github.com/crystaly819/quizlet" target="_blank" rel="noreferrer">GitHub</a>
          </nav>
          <div class="header-controls">
            <div class="header-ambient">
              <span class="sr-only">백색소음</span>
              <select class="header-ambient-select" data-ambient-mode aria-label="백색소음 선택">
                <option value="none">소리 끔</option>
                <option value="rain">비 오는 소리</option>
                <option value="library">도서관 소음</option>
                <option value="forest">숲 소리</option>
                <option value="stream">시냇물</option>
                <option value="waves">파도 소리</option>
                <option value="white">화이트 노이즈</option>
                <option value="brown">브라운 노이즈</option>
              </select>
              <button class="button ghost compact" type="button" data-ambient-toggle>재생</button>
            </div>
            <div class="header-timer" data-focus-timer data-focus-minutes="90" data-break-minutes="15">
              <a class="header-timer-link" href="./timer.html">
                <span class="header-timer-label" data-timer-phase-short>집중</span>
                <strong class="header-timer-time" data-timer-display>90:00</strong>
                <span class="header-timer-meta" data-timer-status>대기 중</span>
              </a>
              <button class="button ghost compact" type="button" data-timer-start-pause>시작</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="shell">
      <section class="study-header">
        <div>
          <p class="eyebrow">골라 푸는 문제집</p>
          <h1 data-list-title>문제 목록을 불러오는 중...</h1>
          <p class="deck-meta">번호와 내용을 보고 풀고 싶은 문제를 선택하세요. 정답은 풀이 화면에서 확인할 수 있어요.</p>
        </div>
        <a class="button ghost" href="./">과목 목록으로</a>
      </section>
      <section class="question-browser" aria-label="과목별 문제 목록">
        <nav class="mode-switcher" aria-label="풀이 상태 필터">
          <a class="mode-link" data-list-mode="all" href="?mode=all">전체</a>
          <a class="mode-link" data-list-mode="unseen" href="?mode=unseen">미풀이</a>
          <a class="mode-link" data-list-mode="wrong" href="?mode=wrong">오답</a>
        </nav>
        <label class="question-search-label" for="question-search">문제 검색</label>
        <input id="question-search" class="question-search" type="search" data-question-search placeholder="문제 내용 또는 번호로 검색" autocomplete="off" />
        <p class="deck-meta" data-list-summary role="status" aria-live="polite"></p>
        <p class="deck-meta">오답은 한 번이라도 틀린 문제입니다. 다른 기기의 기록은 자동으로 합쳐지지 않아요.</p>
        <div class="question-list" data-question-list></div>
        <p class="empty-state hidden" data-list-empty role="status"></p>
      </section>
    </main>
    <script src="./assets/timer.js"></script>
    <script src="./assets/pages-questions.js?v=20261128"></script>
  </body>
  </html>
